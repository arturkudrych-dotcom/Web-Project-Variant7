<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>Контакти | ЦУП</title>
    <style>
        :root {
            --accent: #66fcf1;
            --accent-dim: rgba(102, 252, 241, 0.2);
            --bg-dark: #05080a;
        }

        body {
            background-color: var(--bg-dark);
            /* Фон з сіткою та градієнтом */
            background-image: 
                linear-gradient(var(--accent-dim) 1px, transparent 1px),
                linear-gradient(90deg, var(--accent-dim) 1px, transparent 1px),
                radial-gradient(circle at center, #0b1a24 0%, #05080a 100%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
            color: #fff;
            font-family: 'Courier New', monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- КНОПКА ПОВЕРНЕННЯ ЗЛІВА --- */
        .back-nav {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 1000;
        }

        .back-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 14px;
            border: 1px solid var(--accent);
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            transition: 0.3s;
            box-shadow: 0 0 10px var(--accent-dim);
        }

        .back-link:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px var(--accent);
        }

        /* --- ОСНОВНИЙ КОНТЕЙНЕР --- */
        .contact-container {
            width: 90%;
            max-width: 1100px;
            display: flex;
            gap: 50px;
            background: rgba(10, 15, 20, 0.95);
            border: 2px solid var(--accent);
            padding: 60px;
            position: relative;
            /* Анімоване світіння */
            box-shadow: 0 0 30px rgba(102, 252, 241, 0.2);
            clip-path: polygon(0 0, 96% 0, 100% 4%, 100% 100%, 4% 100%, 0 96%);
            animation: pulse-glow 3s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            from { box-shadow: 0 0 20px rgba(102, 252, 241, 0.2), inset 0 0 10px rgba(102, 252, 241, 0.1); }
            to { box-shadow: 0 0 50px rgba(102, 252, 241, 0.5), inset 0 0 20px rgba(102, 252, 241, 0.2); }
        }

        .contact-info { flex: 1; }
        
        .contact-info h1 {
            color: var(--accent);
            font-size: 50px;
            margin: 0 0 20px 0;
            text-shadow: 0 0 15px var(--accent);
            letter-spacing: 5px;
        }

        .info-panel {
            border-left: 4px solid var(--accent);
            padding-left: 20px;
            margin: 30px 0;
            background: rgba(102, 252, 241, 0.05);
            padding: 15px 20px;
        }

        .status-online { 
            color: #00ff00; 
            text-shadow: 0 0 10px #00ff00;
            font-weight: bold;
        }

        /* --- ФОРМА --- */
        .contact-form {
            flex: 1.3;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 11px;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        input, textarea {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--accent-dim);
            padding: 15px;
            color: var(--accent);
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-dim);
            background: rgba(102, 252, 241, 0.05);
        }

        .send-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 20px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            letter-spacing: 4px;
            transition: 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .send-btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 30px var(--accent);
        }

        /* Ефект ліній на екрані */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 2px);
            pointer-events: none;
            z-index: 2000;
        }
		
		/* АДАПТАЦІЯ ДЛЯ МОБІЛЬНИХ ПРИСТРОЇВ (CHORNI.HTML) */
@media screen and (max-width: 950px) {
    /* Робимо головний контейнер вертикальним */
    .layout-wrapper {
        display: flex !important;
        flex-direction: column !important;
        padding: 10px !important;
        gap: 20px !important;
    }

    /* Скасовуємо горизонтальний ряд для тексту, карти та меню */
    .main-display-row {
        display: flex !important;
        flex-direction: column !important;
        width: 100% !important;
    }

    /* Контейнер із контентом (текст + вікно) */
    .content-area {
        width: 100% !important;
    }

    /* Вікно з візуалізацією NASA (робимо меншим, щоб не займало весь екран) */
    .iframe-window {
        height: 400px !important;
        width: 100% !important;
    }

    /* МЕНЮ (sidebar-right) — тепер воно внизу і на всю ширину */
    .sidebar-right {
        width: 100% !important;
        max-width: 100% !important;
        position: static !important;
        margin: 15px 0 !important;
        padding: 15px !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 10px !important;
        box-sizing: border-box !important;
    }

    /* Кнопки меню робимо великими та зручними */
    .terminal-btn {
        width: 100% !important;
        text-align: center !important;
        padding: 15px !important;
        font-size: 0.9rem !important;
        white-space: normal !important;
    }

    /* Факти внизу сторінки — в одну колонку */
    .facts-grid {
        grid-template-columns: 1fr !important;
    }
}
		
    </style>
</head>
<body>

    <div class="overlay"></div>
<div class="content-container animate-appearance">
    <!-- Кнопка повернення зверху зліва -->
    <nav class="back-nav">
        <a href="index.html" class="back-link">← ГОЛОВНА</a>
    </nav>

    <div class="contact-container">
        <div class="contact-info">
            <h1>ЗВ'ЯЗОК</h1>
            
            <div class="info-panel">
                <p>ЛОКАЦІЯ: СЕКТОР 001, ЗЕМЛЯ</p>
                <p>СТАТУС КАНАЛУ: <span class="status-online">ONLINE</span></p>
                <p>ЧАС ВІДПОВІДІ: 24-48 ГОДИН</p>
            </div>

            <p style="color: #88929b; line-height: 1.6;">
                Маєте запитання щодо екзопланет або бажаєте додати новий об'єкт до нашої бази даних? Надішліть нам сигнал.
            </p>
            
            <div style="margin-top: 60px;">
                <p style="color: var(--accent); margin-bottom: 5px; font-size: 12px;">ПРЯМА ПОШТА:</p>
                <p style="font-size: 14px; color: #fff;">mission-control@student.uzhnu.edu.ua</p>
            </div>
        </div>

        <form class="contact-form" id="signalForm">
            <div class="input-group">
                <label>Ідентифікатор (Ваше ім'я)</label>
                <input type="text" placeholder="Введіть ім'я..." required>
            </div>

            <div class="input-group">
                <label>Канал зв'язку (Email)</label>
                <input type="email" placeholder="example@space.com" required>
            </div>

            <div class="input-group">
                <label>Повідомлення (Ваш сигнал)</label>
                <textarea rows="5" placeholder="Ваш запит до ЦУП..."></textarea>
            </div>

            <button type="submit" class="send-btn">ВІДПРАВИТИ СИГНАЛ</button>
        </form>
    </div>

    <script>
        document.getElementById('signalForm').onsubmit = function(e) {
            e.preventDefault();
            // Красиве повідомлення замість звичайного alert
            const btn = document.querySelector('.send-btn');
            const originalText = btn.innerText;
            btn.innerText = "СИГНАЛ ВІДПРАВЛЕНО!";
            btn.style.background = "#00ff00";
            btn.style.color = "#000";
            btn.style.borderColor = "#00ff00";
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "transparent";
                btn.style.color = "var(--accent)";
                btn.style.borderColor = "var(--accent)";
                this.reset();
            }, 3000);
        };
    </script>

</body>
</html>
